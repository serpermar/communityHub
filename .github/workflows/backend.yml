name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Solo para que `env.ts` pase la validación al cargar el módulo.
      # Los tests de este job no tocan la BD.
      DATABASE_URL: postgresql://app_runtime:dummy@localhost:5432/postgres?sslmode=require
      MIGRATION_DATABASE_URL: postgresql://postgres:dummy@localhost:5432/postgres?sslmode=require
      JWT_SECRET: ci-secret-32-chars-long-enough-123456
      NODE_ENV: test
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: communityhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `sslmode=disable` porque el Postgres de Docker no tiene SSL.
      # `env.ts` lo permite en `NODE_ENV=test` (Fix A).
      DATABASE_URL: postgresql://app_runtime:app_runtime_pw@localhost:5432/communityhub_test?sslmode=disable
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/communityhub_test?sslmode=disable
      JWT_SECRET: ci-secret-32-chars-long-enough-123456
      NODE_ENV: test
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      # El rol app_runtime lo crea `02_rls.sql`, dentro de `db:apply`. NO hay
      # que crearlo antes: si se crea a mano, `02_rls.sql` falla con
      # "role already exists" y `db:apply` aborta.
      - name: Aplicar esquema + funciones SQL + RLS
        run: npm run db:apply

      - name: Configurar password de app_runtime
        # `02_rls.sql` crea el rol sin password (porque no debe tener secretos
        # en un .sql versionado). El password se lo pone aquí, al lado de la
        # URL que lo usa, para que CI funcione con la URL de arriba.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d communityhub_test -c \
            "ALTER ROLE app_runtime WITH LOGIN PASSWORD 'app_runtime_pw'"

      - name: Dar permisos a app_runtime sobre el esquema
        # Los `GRANT` de `02_rls.sql` cubren las tablas que crea `01_schema.sql`,
        # pero no las que se crean en migraciones futuras. Este step cubre las
        # tablas actuales y pone los DEFAULT PRIVILEGES para objetos futuros.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d communityhub_test <<'SQL'
            GRANT USAGE ON SCHEMA public TO app_runtime;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_runtime;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO app_runtime;
          SQL

      - name: Verificar que app_runtime NO tiene BYPASSRLS
        env:
          PGPASSWORD: app_runtime_pw
        run: |
          psql -h localhost -U app_runtime -d communityhub_test -tAc \
            "select rolbypassrls from pg_roles where rolname = current_user" \
            | grep -qx 'f' || { echo "app_runtime tiene BYPASSRLS"; exit 1; }

      - name: Verificar el esquema
        run: npm run db:verify

      - name: Tests de integración
        run: npm run test:integration
