name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check-bundle

      # Los E2E (spec 15 §11) van contra el BACKEND REAL y una BD sembrada
      # (`backend: npm run dev` + `npm run db:seed`); este job solo levanta Vite,
      # así que sin ese backend `npx playwright test` falla con timeout en el
      # primer login. Se dejan opt-in: activa la variable de repositorio
      # E2E_ENABLED=true cuando haya un backend accesible en :3000.
      - name: Install Playwright browsers
        if: vars.E2E_ENABLED == 'true'
        # --with-deps instala las dependencias del sistema (libnss3, libgbm1,
        # etc.). Sin ellas, Chromium falla al arrancar en ubuntu-latest.
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: vars.E2E_ENABLED == 'true'
        run: npx playwright test
