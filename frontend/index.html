<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Gestión de comunidades de vecinos: incidencias, reservas, avisos, votaciones y finanzas."
    />
    <title>CommunityHub</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello
      // claro→oscuro. Repite la lógica de ThemeContext (misma clave y valores).
      ;(function () {
        try {
          var stored = localStorage.getItem('communityhub.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* sin localStorage: se queda el tema por defecto */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
